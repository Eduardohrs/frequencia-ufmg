[project]
name = "frequencia-ufmg-worker"
version = "0.1.0"
description = "Cloudflare Python Worker do Frequência UFMG"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.118,<1",
  "pypdf>=6,<7",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.18,<2",
  "pip-audit>=2.9,<3",
  "pytest>=8.4,<10",
  "pytest-cov>=7,<8",
  "ruff>=0.14,<1",
  "workers-py>=1.8,<2",
  "workers-runtime-sdk>=0.3,<1",
]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=src --cov-branch --cov-report=term-missing --cov-report=xml --cov-fail-under=100"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
files = ["src"]
