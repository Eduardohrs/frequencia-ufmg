name: Build test artifacts

on:
  workflow_dispatch:

concurrency:
  group: build-test-artifacts
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Android and web test builds
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_DEBUG_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_DEBUG_KEYSTORE_PASSWORD }}
      ANDROID_DEBUG_KEY_ALIAS: ${{ secrets.ANDROID_DEBUG_KEY_ALIAS }}
      ANDROID_DEBUG_KEY_PASSWORD: ${{ secrets.ANDROID_DEBUG_KEY_PASSWORD }}
      ANDROID_DEBUG_CERT_SHA256: ${{ secrets.ANDROID_DEBUG_CERT_SHA256 }}
      ENABLE_PYTHON_BACKEND: ${{ vars.ENABLE_PYTHON_BACKEND || 'false' }}
      ENABLE_PYTHON_SCHEDULE_WRITES: ${{ vars.ENABLE_PYTHON_SCHEDULE_WRITES || 'false' }}
      ENABLE_PYTHON_SESSION_WRITES: ${{ vars.ENABLE_PYTHON_SESSION_WRITES || 'false' }}
      ENABLE_PYTHON_OVERVIEW_READS: ${{ vars.ENABLE_PYTHON_OVERVIEW_READS || 'false' }}
      PYTHON_BACKEND_ORIGIN: ${{ vars.PYTHON_BACKEND_ORIGIN }}
      FIREBASE_APP_CHECK_WEB_SITE_KEY: ${{ vars.FIREBASE_APP_CHECK_WEB_SITE_KEY }}
    defaults:
      run:
        working-directory: apps/client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Validate Python backend build configuration
        run: |
          [[ "$ENABLE_PYTHON_BACKEND" == "true" || "$ENABLE_PYTHON_BACKEND" == "false" ]]
          [[ "$ENABLE_PYTHON_SCHEDULE_WRITES" == "true" || "$ENABLE_PYTHON_SCHEDULE_WRITES" == "false" ]]
          [[ "$ENABLE_PYTHON_SESSION_WRITES" == "true" || "$ENABLE_PYTHON_SESSION_WRITES" == "false" ]]
          [[ "$ENABLE_PYTHON_OVERVIEW_READS" == "true" || "$ENABLE_PYTHON_OVERVIEW_READS" == "false" ]]
          if [[ "$ENABLE_PYTHON_SCHEDULE_WRITES" == "true" || "$ENABLE_PYTHON_SESSION_WRITES" == "true" || "$ENABLE_PYTHON_OVERVIEW_READS" == "true" ]]; then
            [[ "$ENABLE_PYTHON_BACKEND" == "true" ]]
          fi
          if [[ "$ENABLE_PYTHON_BACKEND" == "true" ]]; then
            [[ "$PYTHON_BACKEND_ORIGIN" == https://* ]]
            test -n "$FIREBASE_APP_CHECK_WEB_SITE_KEY"
          fi
      - name: Build web
        run: |
          flutter build web \
            --dart-define="ENABLE_PYTHON_BACKEND=$ENABLE_PYTHON_BACKEND" \
            --dart-define="ENABLE_PYTHON_SCHEDULE_WRITES=$ENABLE_PYTHON_SCHEDULE_WRITES" \
            --dart-define="ENABLE_PYTHON_SESSION_WRITES=$ENABLE_PYTHON_SESSION_WRITES" \
            --dart-define="ENABLE_PYTHON_OVERVIEW_READS=$ENABLE_PYTHON_OVERVIEW_READS" \
            --dart-define="PYTHON_BACKEND_ORIGIN=$PYTHON_BACKEND_ORIGIN" \
            --dart-define="FIREBASE_APP_CHECK_WEB_SITE_KEY=$FIREBASE_APP_CHECK_WEB_SITE_KEY"
      - name: Restore stable Android test signing key
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_DEBUG_KEYSTORE_BASE64"
          test -n "$ANDROID_DEBUG_KEYSTORE_PASSWORD"
          test -n "$ANDROID_DEBUG_KEY_ALIAS"
          test -n "$ANDROID_DEBUG_KEY_PASSWORD"
          keystore_path="$RUNNER_TEMP/frequencia-ufmg-debug.keystore"
          printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          chmod 600 "$keystore_path"
          echo "ANDROID_DEBUG_KEYSTORE_PATH=$keystore_path" >> "$GITHUB_ENV"
      - name: Build Android debug APK
        run: |
          flutter build apk --debug \
            --dart-define="ENABLE_PYTHON_BACKEND=$ENABLE_PYTHON_BACKEND" \
            --dart-define="ENABLE_PYTHON_SCHEDULE_WRITES=$ENABLE_PYTHON_SCHEDULE_WRITES" \
            --dart-define="ENABLE_PYTHON_SESSION_WRITES=$ENABLE_PYTHON_SESSION_WRITES" \
            --dart-define="ENABLE_PYTHON_OVERVIEW_READS=$ENABLE_PYTHON_OVERVIEW_READS" \
            --dart-define="PYTHON_BACKEND_ORIGIN=$PYTHON_BACKEND_ORIGIN"
      - name: Verify APK signing certificate
        run: |
          apksigner=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          certificates=$("$apksigner" verify --print-certs \
            build/app/outputs/flutter-apk/app-debug.apk)
          printf '%s\n' "$certificates"
          actual=$(printf '%s\n' "$certificates" | \
            sed -n -E 's/.*SHA-256 digest:[[:space:]]*//p' | \
            head -n 1 | tr -d '[:space:]:' | tr '[:upper:]' '[:lower:]')
          expected=$(printf '%s' "$ANDROID_DEBUG_CERT_SHA256" | \
            tr -d '[:space:]:' | tr '[:upper:]' '[:lower:]')
          echo "APK signer SHA-256: $actual"
          echo "Certificate lengths: actual=${#actual}, expected=${#expected}"
          test -n "$expected"
          test -n "$actual"
          test "$actual" = "$expected"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frequencia-ufmg-web-${{ github.sha }}
          path: apps/client/build/web
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frequencia-ufmg-android-debug-${{ github.sha }}
          path: apps/client/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 1
