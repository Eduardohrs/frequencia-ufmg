name: Build test artifacts

on:
  workflow_dispatch:

concurrency:
  group: build-test-artifacts
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Android and web test builds
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_DEBUG_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_DEBUG_KEYSTORE_PASSWORD }}
      ANDROID_DEBUG_KEY_ALIAS: ${{ secrets.ANDROID_DEBUG_KEY_ALIAS }}
      ANDROID_DEBUG_KEY_PASSWORD: ${{ secrets.ANDROID_DEBUG_KEY_PASSWORD }}
      ANDROID_DEBUG_CERT_SHA256: ${{ secrets.ANDROID_DEBUG_CERT_SHA256 }}
    defaults:
      run:
        working-directory: apps/client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter build web
      - name: Restore stable Android test signing key
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_DEBUG_KEYSTORE_BASE64"
          test -n "$ANDROID_DEBUG_KEYSTORE_PASSWORD"
          test -n "$ANDROID_DEBUG_KEY_ALIAS"
          test -n "$ANDROID_DEBUG_KEY_PASSWORD"
          keystore_path="$RUNNER_TEMP/frequencia-ufmg-debug.keystore"
          printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          chmod 600 "$keystore_path"
          echo "ANDROID_DEBUG_KEYSTORE_PATH=$keystore_path" >> "$GITHUB_ENV"
      - run: flutter build apk --debug
      - name: Verify APK signing certificate
        run: |
          apksigner=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          certificates=$("$apksigner" verify --print-certs \
            build/app/outputs/flutter-apk/app-debug.apk)
          printf '%s\n' "$certificates"
          actual=$(printf '%s\n' "$certificates" | \
            sed -n -E 's/.*SHA-256 digest:[[:space:]]*//p' | \
            head -n 1 | tr -d '[:space:]:' | tr '[:upper:]' '[:lower:]')
          expected=$(printf '%s' "$ANDROID_DEBUG_CERT_SHA256" | \
            tr -d '[:space:]:' | tr '[:upper:]' '[:lower:]')
          echo "APK signer SHA-256: $actual"
          echo "Certificate lengths: actual=${#actual}, expected=${#expected}"
          test -n "$expected"
          test -n "$actual"
          test "$actual" = "$expected"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frequencia-ufmg-web-${{ github.sha }}
          path: apps/client/build/web
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frequencia-ufmg-android-debug-${{ github.sha }}
          path: apps/client/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 1
