name: Preflight Appwrite key scopes (read-only)

# Manual, read-only diagnostic: reports which API key the storage provisioner
# would use and whether it carries the schema-write scopes provisioning needs.
# Never prints secret values. Does not touch production data.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    name: Read key scopes and probe read access
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
    env:
      APPWRITE_ENDPOINT: ${{ vars.APPWRITE_ENDPOINT }}
      APPWRITE_PROJECT_ID: ${{ vars.APPWRITE_PROJECT_ID }}
      APPWRITE_DEPLOY_KEY: ${{ secrets.APPWRITE_DEPLOY_KEY }}
      APPWRITE_ADMIN_API_KEY: ${{ secrets.APPWRITE_ADMIN_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.14"

      - name: Read-only scope preflight (never prints key values)
        run: |
          python -m pip install --requirement appwrite-python/requirements.txt
          python appwrite-python/preflight_key_scopes.py
