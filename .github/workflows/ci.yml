name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy src
      - run: pytest
      - uses: codecov/codecov-action@v7
        if: env.CODECOV_TOKEN != ''
        with:
          files: backend/coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  client:
    name: Flutter client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/client
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test --coverage
      - name: Require 100% line coverage
        run: |
          python - <<'PY'
          from pathlib import Path
          found = hit = 0
          for line in Path("coverage/lcov.info").read_text().splitlines():
              if line.startswith("LF:"):
                  found += int(line[3:])
              elif line.startswith("LH:"):
                  hit += int(line[3:])
          if not found or hit != found:
              raise SystemExit(f"Line coverage must be 100%: {hit}/{found}")
          print(f"Line coverage: {hit}/{found} (100%)")
          PY
      - uses: codecov/codecov-action@v7
        if: env.CODECOV_TOKEN != ''
        with:
          files: apps/client/coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  quality-gate:
    name: Quality Gate
    if: always()
    needs: [backend, client]
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs
        run: |
          test "${{ needs.backend.result }}" = "success"
          test "${{ needs.client.result }}" = "success"

