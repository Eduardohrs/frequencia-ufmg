name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  backend:
    name: Backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy src
      - run: pytest
      - uses: codecov/codecov-action@v7
        with:
          files: backend/coverage.xml
          flags: backend
          use_oidc: true
          fail_ci_if_error: true

  client:
    name: Flutter client
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: apps/client
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter build web
      - run: flutter build apk --debug
      - run: flutter test --coverage
      - name: Require 100% line coverage
        run: |
          python - <<'PY'
          from pathlib import Path
          found = hit = 0
          source = "unknown"
          missed = []
          for line in Path("coverage/lcov.info").read_text().splitlines():
              if line.startswith("SF:"):
                  source = line[3:]
              elif line.startswith("DA:"):
                  line_number, count, *_ = line[3:].split(",")
                  if int(count) == 0:
                      missed.append(f"{source}:{line_number}")
              elif line.startswith("LF:"):
                  found += int(line[3:])
              elif line.startswith("LH:"):
                  hit += int(line[3:])
          if not found or hit != found:
              details = ", ".join(missed) or "unavailable"
              raise SystemExit(
                  f"Line coverage must be 100%: {hit}/{found}; missed: {details}"
              )
          print(f"Line coverage: {hit}/{found} (100%)")
          PY
      - uses: codecov/codecov-action@v7
        with:
          files: apps/client/coverage/lcov.info
          flags: flutter
          use_oidc: true
          fail_ci_if_error: true

  quality-gate:
    name: Quality Gate
    if: always()
    needs: [secret-scan, backend, client]
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs
        run: |
          test "${{ needs.secret-scan.result }}" = "success"
          test "${{ needs.backend.result }}" = "success"
          test "${{ needs.client.result }}" = "success"
