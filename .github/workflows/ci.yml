name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install --upgrade pip "setuptools>=83"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pip check
      - run: pip-audit
      - run: ruff check .
      - run: mypy src
      - run: pytest
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          files: backend/coverage.xml
          flags: backend
          use_oidc: true
          fail_ci_if_error: true

  client:
    name: Flutter client
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: apps/client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - name: Verify observability contract
        run: flutter test test/audited_operation_test.dart
      - run: flutter test --coverage
      - name: Require 100% line coverage
        run: |
          python - <<'PY'
          from pathlib import Path
          found = hit = 0
          source = "unknown"
          missed = []
          for line in Path("coverage/lcov.info").read_text().splitlines():
              if line.startswith("SF:"):
                  source = line[3:]
              elif line.startswith("DA:"):
                  line_number, count, *_ = line[3:].split(",")
                  if int(count) == 0:
                      missed.append(f"{source}:{line_number}")
              elif line.startswith("LF:"):
                  found += int(line[3:])
              elif line.startswith("LH:"):
                  hit += int(line[3:])
          if not found or hit != found:
              details = ", ".join(missed) or "unavailable"
              raise SystemExit(
                  f"Line coverage must be 100%: {hit}/{found}; missed: {details}"
              )
          print(f"Line coverage: {hit}/{found} (100%)")
          PY
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          files: apps/client/coverage/lcov.info
          flags: flutter
          use_oidc: true
          fail_ci_if_error: true
      - run: flutter build web

  quality-gate:
    name: Quality Gate
    if: always()
    needs: [secret-scan, backend, client]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify required jobs
        run: |
          test "${{ needs.secret-scan.result }}" = "success"
          test "${{ needs.backend.result }}" = "success"
          test "${{ needs.client.result }}" = "success"
