name: Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build signed release
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ANDROID_DEBUG_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_DEBUG_KEYSTORE_PASSWORD }}
      ANDROID_DEBUG_KEY_ALIAS: ${{ secrets.ANDROID_DEBUG_KEY_ALIAS }}
      ANDROID_DEBUG_KEY_PASSWORD: ${{ secrets.ANDROID_DEBUG_KEY_PASSWORD }}
      ANDROID_DEBUG_CERT_SHA256: ${{ secrets.ANDROID_DEBUG_CERT_SHA256 }}
      ENABLE_PYTHON_BACKEND: ${{ vars.ENABLE_PYTHON_BACKEND || 'false' }}
      ENABLE_PYTHON_SCHEDULE_WRITES: ${{ vars.ENABLE_PYTHON_SCHEDULE_WRITES || 'false' }}
      PYTHON_BACKEND_ORIGIN: ${{ vars.PYTHON_BACKEND_ORIGIN }}
      FIREBASE_APP_CHECK_WEB_SITE_KEY: ${{ vars.FIREBASE_APP_CHECK_WEB_SITE_KEY }}
    defaults:
      run:
        working-directory: apps/client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Validate release tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"
      - name: Restore stable Android signing key
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_DEBUG_KEYSTORE_BASE64"
          test -n "$ANDROID_DEBUG_KEYSTORE_PASSWORD"
          test -n "$ANDROID_DEBUG_KEY_ALIAS"
          test -n "$ANDROID_DEBUG_KEY_PASSWORD"
          keystore_path="$RUNNER_TEMP/frequencia-ufmg-release.keystore"
          printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          chmod 600 "$keystore_path"
          echo "ANDROID_DEBUG_KEYSTORE_PATH=$keystore_path" >> "$GITHUB_ENV"
      - name: Build web and signed Android release
        run: |
          [[ "$ENABLE_PYTHON_BACKEND" == "true" || "$ENABLE_PYTHON_BACKEND" == "false" ]]
          [[ "$ENABLE_PYTHON_SCHEDULE_WRITES" == "true" || "$ENABLE_PYTHON_SCHEDULE_WRITES" == "false" ]]
          if [[ "$ENABLE_PYTHON_SCHEDULE_WRITES" == "true" ]]; then
            [[ "$ENABLE_PYTHON_BACKEND" == "true" ]]
          fi
          if [[ "$ENABLE_PYTHON_BACKEND" == "true" ]]; then
            [[ "$PYTHON_BACKEND_ORIGIN" == https://* ]]
            test -n "$FIREBASE_APP_CHECK_WEB_SITE_KEY"
          fi
          flutter build web \
            --build-name "$APP_VERSION" \
            --build-number "$GITHUB_RUN_NUMBER" \
            --dart-define="ENABLE_PYTHON_BACKEND=$ENABLE_PYTHON_BACKEND" \
            --dart-define="ENABLE_PYTHON_SCHEDULE_WRITES=$ENABLE_PYTHON_SCHEDULE_WRITES" \
            --dart-define="PYTHON_BACKEND_ORIGIN=$PYTHON_BACKEND_ORIGIN" \
            --dart-define="FIREBASE_APP_CHECK_WEB_SITE_KEY=$FIREBASE_APP_CHECK_WEB_SITE_KEY"
          flutter build apk --release \
            --build-name "$APP_VERSION" \
            --build-number "$GITHUB_RUN_NUMBER" \
            --dart-define="ENABLE_PYTHON_BACKEND=$ENABLE_PYTHON_BACKEND" \
            --dart-define="ENABLE_PYTHON_SCHEDULE_WRITES=$ENABLE_PYTHON_SCHEDULE_WRITES" \
            --dart-define="PYTHON_BACKEND_ORIGIN=$PYTHON_BACKEND_ORIGIN"
      - name: Verify APK signing certificate
        run: |
          apksigner=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          certificates=$("$apksigner" verify --print-certs \
            build/app/outputs/flutter-apk/app-release.apk)
          actual=$(printf '%s\n' "$certificates" | \
            sed -n -E 's/.*SHA-256 digest:[[:space:]]*//p' | \
            head -n 1 | tr -d '[:space:]:' | tr '[:upper:]' '[:lower:]')
          expected=$(printf '%s' "$ANDROID_DEBUG_CERT_SHA256" | \
            tr -d '[:space:]:' | tr '[:upper:]' '[:lower:]')
          test -n "$expected"
          test -n "$actual"
          test "$actual" = "$expected"
      - name: Package release files
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk \
            "frequencia-ufmg-$APP_VERSION.apk"
          (cd build/web && zip -qr "../../frequencia-ufmg-web-$APP_VERSION.zip" .)
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "frequencia-ufmg-$APP_VERSION.apk" \
            "frequencia-ufmg-web-$APP_VERSION.zip" \
            --repo "$GITHUB_REPOSITORY" \
            --generate-notes \
            --title "Frequência UFMG $APP_VERSION"
