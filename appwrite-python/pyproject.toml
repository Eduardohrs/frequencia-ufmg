[project]
name = "frequencia-ufmg-appwrite-spike"
version = "0.1.0"
description = "Appwrite Python Function feasibility spike"
requires-python = ">=3.12,<3.15"
dependencies = [
  "appwrite==24.0.0",
  "google-auth==2.59.1",
  "PyJWT[crypto]>=2.10,<3",
  "pypdf==6.19.0",
]

[dependency-groups]
dev = [
  "mypy>=1.18,<2",
  "pip-audit>=2.9,<3",
  "pytest>=9,<10",
  "pytest-cov>=7,<8",
  "ruff>=0.14,<1",
]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=src --cov-branch --cov-report=term-missing --cov-report=xml --cov-fail-under=100"
pythonpath = [".", "src", "../backend/src"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
mypy_path = ["src", "../backend/src"]

[[tool.mypy.overrides]]
module = ["appwrite.*"]
ignore_missing_imports = true
